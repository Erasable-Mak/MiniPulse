networks:
  minipulse-net:
    driver: bridge

services:
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=ai-service
    restart: unless-stopped
    networks:
      - minipulse-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  slack-adapter:
    build:
      context: ./services/slack-adapter
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=slack-adapter
      - AI_SERVICE_URL=http://ai-service:8000
    restart: unless-stopped
    networks:
      - minipulse-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      ai-service:
        condition: service_healthy
